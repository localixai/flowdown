<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Social card</title>
  <!-- The source of og.png, the picture a link preview shows. Edit the words, then render it at
       1200×630 with a headless browser:
       chrome --headless --screenshot=public/og.png --window-size=1200,630 public/og-card.html -->
  <style>
    @font-face { font-family: 'Display'; src: url(fonts/dm-sans.woff2) format('woff2'); font-weight: 100 1000; }
    @font-face { font-family: 'Text'; src: url(fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
    @font-face { font-family: 'Mono'; src: url(fonts/jetbrains-mono.woff2) format('woff2'); font-weight: 100 800; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050505; color: #f4f4f2; }
    body { position: relative; }
    .og-head { position: absolute; left: 80px; top: 64px; }
    .og-name { font: 600 64px/1 'Display', sans-serif; letter-spacing: -0.04em; }
    .og-tag { margin-top: 18px; color: #b0b0ad; font: 400 26px/1.35 'Text', sans-serif; letter-spacing: -0.01em; }
    .og-url { position: absolute; right: 80px; top: 76px; color: #8b8b87; font: 400 20px/1 'Mono', monospace; }
    .og-term { position: absolute; left: 80px; right: 80px; top: 260px; height: 400px; background: #090909; border: 1px solid #2a2a28; border-radius: 16px; }
    .og-bar { display: flex; gap: 8px; padding: 18px 20px; }
    .og-bar i { width: 11px; height: 11px; border-radius: 50%; background: #2a2a28; }
    pre { margin: 0; padding: 6px 28px; font: 400 19px/1.8 'Mono', monospace; color: #e6e6e6; white-space: pre; }
    .p { color: #8b8b87; }
    .o { color: #8bd49c; }
    .og-fade { position: absolute; inset: auto 0 0 0; height: 130px; background: linear-gradient(transparent, #050505 85%); }
  </style>
</head>
<body>
  <div class="og-head">
    <div class="og-name">flowdown</div>
    <div class="og-tag">Markdown that draws while the model is still writing</div>
  </div>
  <div class="og-url">flowdown.dev</div>
  <div class="og-term">
    <div class="og-bar"><i></i><i></i><i></i></div>
<pre><span class="p">$</span> npm install @localix/flowdown
<span class="p">import</span> { Markdown } <span class="p">from</span> '@localix/flowdown'
<span class="p">&lt;</span>Markdown streaming<span class="p">&gt;</span>{text}<span class="p">&lt;/</span>Markdown<span class="p">&gt;</span>
<span class="o">0.13 s</span> to stream 100k characters · <span class="o">31.7 KB</span> · <span class="o">0</span> dependencies</pre>
  </div>
  <div class="og-fade"></div>
</body>
</html>
