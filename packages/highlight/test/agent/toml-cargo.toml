[package]
name = "words"
version = "0.3.1"
edition = "2021"
authors = ["Ada <ada@example.com>"]
description = """
Counts the words of a file.
"""

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", default-features = false }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[[bin]]
name = "words"
path = "src/main.rs"

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
created = 2026-11-21T14:00:00Z
