<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
.title { font-size: 15px; font-weight: 600; }
.note { font-size: 12px; fill: #59636e; }
.label, .value { font-size: 12.5px; }
.value { fill: #59636e; font-variant-numeric: tabular-nums; }
.ours { font-size: 12.5px; font-weight: 600; fill: #6e56cf; font-variant-numeric: tabular-nums; }
.inside { font-size: 11.5px; fill: #1f2328; }
</style>
</defs>
