# The Rust crate (crates/flowdown): its checks on every change that can move it: the crate, spec/
# (its tests read the specifications and the forms' cases), docs/rust.md (its examples are the
# crate's doctests) and the Cargo files. Its prompt and tables are written by the npm package;
# ci.yml, which runs on every change, fails when they are not what the package writes, and
# writing them again changes crates/, which runs this.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'spec/**'
      - 'docs/rust.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'spec/**'
      - 'docs/rust.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, the lints, the tests (the README's example, spec/'s cases and the crate's own
  # rules), the docs with warnings denied, the wasm build and what a package carries:
  # crates/flowdown/scripts/check, as it runs locally.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rust-toolchain.toml names the toolchain, its components and the wasm target.
      - run: rustup toolchain install
      - run: crates/flowdown/scripts/check

  # The oldest Rust the crate says it builds on (Cargo.toml's rust-version).
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tests on Cargo.toml's rust-version
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          cargo +"$version" test --locked --package flowdown

  # The benchmarks are not timed here (a shared runner's times say little): the results committed
  # with the change are held to crates/flowdown/bench/budgets.json.
  budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install
      - name: The committed results hold to the budgets
        run: cargo run --locked --quiet --release --bin check --manifest-path crates/flowdown/bench/Cargo.toml
