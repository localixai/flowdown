name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      # The sweeps over every prefix of the seeded replies run locally; see test/heavy.ts.
      - run: bun run test
        env:
          LLX_SKIP_HEAVY: '1'
      # The package as it would be published: exports, types, entry isolation, 'use client'.
      - run: bun run build
      - run: bun run check
      # Bundle size: each entry's own code and what loads with <Markdown>, against their budgets.
      - run: bun run size
