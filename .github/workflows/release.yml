name: Release

# Push a tag `v<version>`, the version in packages/flowdown/package.json, to publish it to npm
# as `flowdown`. The token is the repository secret `NPM_TOKEN`.

on:
  push:
    tags: ['v*']
  # To publish again a version whose run failed before npm took it: run from main, by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # For npm provenance: the package page links the build that published it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: The tag names the package's version
        working-directory: packages/flowdown
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$EVENT" = workflow_dispatch ]; then
            git fetch --quiet --tags origin
            if ! git rev-parse --quiet --verify "refs/tags/v$version" > /dev/null; then
              echo "::error::no tag v$version for packages/flowdown/package.json"
              exit 1
            fi
          elif [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG, but packages/flowdown/package.json is $version"
            exit 1
          fi

      - run: bun run typecheck
      # The sweeps over every prefix of the seeded replies run locally; see test/heavy.ts.
      - run: bun run test
        env:
          FLOWDOWN_SKIP_HEAVY: '1'
      - run: bun run build
      - run: bun run check

      - name: Publish
        working-directory: packages/flowdown
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # In the user's config: inside a workspace npm reads the root's .npmrc, not this folder's.
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm whoami --registry https://registry.npmjs.org
          npm publish --access public --provenance --registry https://registry.npmjs.org
