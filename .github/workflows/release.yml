name: Release

# Push a tag `v<version>`, the version in packages/llx-markdown/package.json, to publish it to npm
# as `llx-markdown`. The token is the repository secret `NPM_TOKEN`.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: The tag names the package's version
        working-directory: packages/llx-markdown
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG, but packages/llx-markdown/package.json is $version"
            exit 1
          fi

      - run: bun run typecheck
      # The sweeps over every prefix of the seeded replies run locally; see test/heavy.ts.
      - run: bun run test
        env:
          LLX_SKIP_HEAVY: '1'
      - run: bun run build
      - run: bun run check

      - name: Publish
        working-directory: packages/llx-markdown
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # In the user's config: inside a workspace npm reads the root's .npmrc, not this folder's.
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm whoami --registry https://registry.npmjs.org
          npm publish --access public --registry https://registry.npmjs.org
