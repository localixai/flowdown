name: Highlight release

# Publishes @localix-ai/highlight (packages/highlight) to npm at the version in its package.json,
# and makes the GitHub release `highlight-v<version>` with that version's part of
# packages/highlight/CHANGELOG.md. Run it from main by hand (Actions, Highlight release, Run
# workflow), or push the tag `highlight-v<version>`. flowdown's tags are `v<version>` and the
# crate's `rust-v<version>`: no tag matches another's pattern. A version npm has already is not
# published again, so a run that failed after npm took it can be run again for its release.

on:
  push:
    tags: ['highlight-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: highlight-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # For the tag and the GitHub release.
      contents: write
      # For npm provenance: the package page links the build that published it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: The tag names the package's version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version packages/highlight/package.json)"
          if [ "$TAG" != "highlight-v$version" ]; then
            echo "::error::tag $TAG, but packages/highlight/package.json is $version"
            exit 1
          fi

      - name: The checks
        working-directory: packages/highlight
        run: |
          bun run typecheck
          bun run test
          bun run build
          bun run check
          bun run size

      - name: Publish
        working-directory: packages/highlight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          # In the user's config: inside a workspace npm reads the root's .npmrc, not this folder's.
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm whoami --registry https://registry.npmjs.org
          if npm view "@localix-ai/highlight@$version" version --registry https://registry.npmjs.org > /dev/null 2>&1; then
            echo "npm has @localix-ai/highlight@$version already"
          else
            npm publish --access public --provenance --registry https://registry.npmjs.org
          fi

      # After npm has the version. Run by hand, this makes the tag on the commit it ran on.
      - name: The release, with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version packages/highlight/package.json)"
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' \
            packages/highlight/CHANGELOG.md > notes.md
          gh release view "highlight-v$version" > /dev/null 2>&1 ||
            gh release create "highlight-v$version" --title "@localix-ai/highlight $version" \
              --notes-file notes.md --target "$GITHUB_SHA"
