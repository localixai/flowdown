# Checks site/ (the landing and the docs at flowdown.dev) on every change that reaches it on main,
# and publishes what it built to Cloudflare Pages (project flowdown). The site renders with the
# library from this repository and reads docs/ and the library's changelog, so a change to any of
# them publishes it again. Publishing needs two repository secrets, CLOUDFLARE_API_TOKEN
# (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID; until both are set the run only
# checks. Like CI's publishing, nothing here runs for a pull request.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'packages/flowdown/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# The newest build wins: an older one still running has nothing to add.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          # A build that publishes restores no cache another run could have written.
          no-cache: true
      # The site's scripts run on Node (it asks for 22 or later).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          package-manager-cache: false
      # The site is a workspace of this repository and uses the library as built here.
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The layers, the types, the build and the docs' standard; it leaves the site in dist/.
      - run: bun run check
        working-directory: site
      # Wrangler by bunx, pinned: wrangler-action installs it with npm, which cannot read this
      # Bun workspace (`workspace:*`).
      - name: Publish dist/ to Pages
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site
        run: bunx wrangler@4.161.0 pages deploy dist --project-name=flowdown --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false
