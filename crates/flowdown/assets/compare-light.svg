<text x="28.0" y="578.0" fill="#59636e" font-size="11.5">Each panel has its own scale; the number beside a bar is the measurement. Every figure comes from a binary in bench/.</text>
<text x="28.0" y="595.0" fill="#59636e" font-size="11.5">pulldown-cmark gives events and builds no tree: its events are dropped as they come, the least it can be asked for.</text>
