# The lints are in Cargo.toml; this is their configuration (AGENTS.md, rule R4).

# Tests may unwrap, panic and print: a failed test is the panic's job (R1).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

too-many-lines-threshold = 100
cognitive-complexity-threshold = 25
max-fn-params-bools = 2
max-struct-bools = 3

# A library does no I/O and keeps no state between calls (R6).
disallowed-methods = [
    { path = "std::process::exit", reason = "a library never ends the process" },
    { path = "std::env::var", reason = "a library reads nothing from the environment: take it as an argument" },
    { path = "std::env::set_var", reason = "a library never changes the environment" },
    { path = "std::thread::spawn", reason = "a text is read on its caller's thread" },
    { path = "std::thread::sleep", reason = "reading never waits" },
]
disallowed-types = [
    { path = "std::cell::RefCell", reason = "a Document is Send + Sync" },
    { path = "std::cell::Cell", reason = "a Document is Send + Sync" },
    { path = "std::rc::Rc", reason = "a Document is Send + Sync: Arc" },
]
